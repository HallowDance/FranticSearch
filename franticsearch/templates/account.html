{% extends "base.html" %}{% block title %}Account{% endblock %}
{% block body %}
<h1>Account: {{ user.username }}{% if user.is_admin %} <span class="muted">(admin)</span>{% endif %}</h1>
<form method="post" action="{{ url_for('account') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<fieldset><legend>Change password</legend>
<table class="kv">
<tr><th>Current</th><td><input type="password" name="current" autocomplete="current-password" required></td></tr>
<tr><th>New</th><td><input type="password" name="new" autocomplete="new-password" minlength="8" required></td></tr>
<tr><th>Repeat</th><td><input type="password" name="repeat" autocomplete="new-password" minlength="8" required></td></tr>
<tr><th></th><td><button>Change password</button></td></tr>
</table>
</fieldset>
</form>
{% endblock %}
